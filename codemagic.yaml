workflows:
  android-debug:
    name: Android debug APK
    max_build_duration: 30
    environment:
      android_signing:
        - debug_keystore
      vars:
        PACKAGE_NAME: "com.example.fortnitescreenobserver"
      android:
        compile_sdk: 35
        target_sdk: 35
    scripts:
      - name: Build debug APK
        script: |
          ./gradlew assembleDebug
    artifacts:
      - app/build/outputs/apk/debug/app-debug.apk
