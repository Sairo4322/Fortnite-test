workflows:
  android-debug:
    name: Android debug APK
    max_build_duration: 30
    environment:
      vars:
        PACKAGE_NAME: "com.example.fortnitetest"
    scripts:
      - name: Build debug APK
        script: |
          chmod +x gradlew
          ./gradlew assembleDebug
    artifacts:
      - app/build/outputs/apk/debug/*.apk
